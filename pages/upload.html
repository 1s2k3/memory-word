<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传碎片 · TA的小世界</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

  <style id="theme-vars">
    :root {
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 80px;
      --r-xs: 2px; --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;
      --brand: #E89B8C; --brand-strong: #D77B6A; --brand-soft: #F6D9D1; --brand-tint: #FCEEEA; --brand-ink: #5A2A20;
      --bg: #FBF7F4; --surface: #FFFFFF; --surface-2: #F6EFEA; --surface-3: #EFE4DC;
      --ink: #3A2A24; --ink-2: #6B5750; --ink-3: #9C8B83;
      --line: #EBE0D8; --line-soft: #F3EAE3;
      --state-success: #7FAE8E; --state-warning: #E0A86A; --state-error: #D96666; --state-info: #7BA3C4;
      --shadow-1: 0 1px 2px rgba(122, 80, 70, 0.05), 0 1px 1px rgba(122, 80, 70, 0.03);
      --shadow-2: 0 8px 24px -8px rgba(122, 80, 70, 0.16);
      --shadow-3: 0 24px 60px -20px rgba(122, 80, 70, 0.28);
      --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
      --font-hand: "Caveat", "Noto Sans SC", cursive;
      --brand-background: var(--bg); --brand-foreground: var(--ink); --brand-card: var(--surface); --brand-card-foreground: var(--ink);
      --brand-popover: var(--surface); --brand-popover-foreground: var(--ink);
      --brand-primary: var(--brand-strong); --brand-primary-foreground: #FFFFFF;
      --brand-secondary: var(--surface-3); --brand-secondary-foreground: var(--ink-2);
      --brand-muted: var(--surface-2); --brand-muted-foreground: var(--ink-2);
      --brand-accent: var(--brand-soft); --brand-accent-foreground: var(--brand-ink);
      --brand-destructive: var(--state-error); --brand-destructive-foreground: #FFFFFF;
      --brand-border: var(--line); --brand-input: var(--line); --brand-ring: var(--brand-strong);
      --brand-radius-sm: var(--r-sm); --brand-radius-md: var(--r-md); --brand-radius-lg: var(--r-lg); --brand-radius-xl: var(--r-xl);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    ::selection { background: var(--brand-soft); color: var(--brand-ink); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: var(--r-pill); border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--brand-soft); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--brand-background);
      --color-foreground: var(--brand-foreground);
      --color-card: var(--brand-card);
      --color-card-foreground: var(--brand-card-foreground);
      --color-popover: var(--brand-popover);
      --color-popover-foreground: var(--brand-popover-foreground);
      --color-primary: var(--brand-primary);
      --color-primary-foreground: var(--brand-primary-foreground);
      --color-secondary: var(--brand-secondary);
      --color-secondary-foreground: var(--brand-secondary-foreground);
      --color-muted: var(--brand-muted);
      --color-muted-foreground: var(--brand-muted-foreground);
      --color-accent: var(--brand-accent);
      --color-accent-foreground: var(--brand-accent-foreground);
      --color-destructive: var(--brand-destructive);
      --color-destructive-foreground: var(--brand-destructive-foreground);
      --color-border: var(--brand-border);
      --color-input: var(--brand-input);
      --color-ring: var(--brand-ring);
      --radius-sm: var(--brand-radius-sm);
      --radius-md: var(--brand-radius-md);
      --radius-lg: var(--brand-radius-lg);
      --radius-xl: var(--brand-radius-xl);
    }
    @layer base {
      body { background: var(--brand-background); color: var(--brand-foreground); }
      td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
      th { @apply whitespace-nowrap; }
    }
  </style>

  <style id="semantic-token-fallback">
    .bg-background { background-color: var(--brand-background); }
    .text-foreground { color: var(--brand-foreground); }
    .bg-card { background-color: var(--brand-card); }
    .text-card-foreground { color: var(--brand-card-foreground); }
    .bg-popover { background-color: var(--brand-popover); }
    .text-popover-foreground { color: var(--brand-popover-foreground); }
    .bg-primary { background-color: var(--brand-primary); }
    .text-primary { color: var(--brand-primary); }
    .text-primary-foreground { color: var(--brand-primary-foreground); }
    .border-primary { border-color: var(--brand-primary); }
    .bg-secondary { background-color: var(--brand-secondary); }
    .text-secondary { color: var(--brand-secondary); }
    .text-secondary-foreground { color: var(--brand-secondary-foreground); }
    .bg-muted { background-color: var(--brand-muted); }
    .text-muted-foreground { color: var(--brand-muted-foreground); }
    .bg-accent { background-color: var(--brand-accent); }
    .text-accent { color: var(--brand-accent); }
    .text-accent-foreground { color: var(--brand-accent-foreground); }
    .bg-destructive { background-color: var(--brand-destructive); }
    .text-destructive { color: var(--brand-destructive); }
    .text-destructive-foreground { color: var(--brand-destructive-foreground); }
    .border-border { border-color: var(--brand-border); }
    .border-input { border-color: var(--brand-input); }
    .bg-input { background-color: var(--brand-input); }
    .ring-ring { --tw-ring-color: var(--brand-ring); box-shadow: 0 0 0 2px var(--brand-ring); }
  </style>

  <style>
    [data-icon] { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 1em; height: 1em; }
    [data-icon] svg { width: 100%; height: 100%; display: block; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .icon-14 { width: 14px; height: 14px; }
    .icon-16 { width: 16px; height: 16px; }
    .icon-18 { width: 18px; height: 18px; }
    .icon-20 { width: 20px; height: 20px; }
    .icon-48 { width: 48px; height: 48px; }
  </style>

  <style id="critical-layout">
    /* Topbar */
    .topbar { position: sticky; top: 0; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1080px; margin: 0 auto; padding: var(--s-3) var(--s-4); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
    .topbar-link { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: var(--r-md); transition: color .15s, background .15s; white-space: nowrap; }
    .topbar-link:hover { color: var(--brand-strong); background: var(--brand-tint); }
    .topbar-link:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 2px; }
    .topbar-title { font-family: var(--font-display); font-size: 16px; color: var(--ink); font-weight: 600; text-align: center; flex: 1; min-width: 0; }

    /* Main */
    #upload-main { max-width: 880px; margin: 0 auto; padding: var(--s-6) var(--s-4) 120px; }
    .upload-header { margin-bottom: var(--s-5); }
    .upload-title { font-family: var(--font-display); font-size: 32px; line-height: 1.2; color: var(--ink); margin: 0 0 var(--s-2); font-weight: 700; letter-spacing: 0.5px; }
    .upload-subtitle { color: var(--ink-2); font-size: 15px; margin: 0 0 var(--s-3); }
    .upload-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; margin: 0; padding: 6px 12px; background: var(--surface-2); border-radius: var(--r-md); }

    /* Drop zone */
    #drop-zone { border: 2px dashed var(--line); border-radius: var(--r-lg); background: var(--surface); padding: var(--s-7) var(--s-4); text-align: center; transition: border-color .2s, background .2s; cursor: pointer; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-2); }
    #drop-zone:hover { border-color: var(--brand-soft); }
    #drop-zone:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 3px; }
    #drop-zone.is-dragover { border-color: var(--brand-strong); background: var(--brand-tint); }
    .drop-icon { color: var(--brand); }
    .drop-text { font-size: 16px; color: var(--ink); margin: var(--s-2) 0 0; font-weight: 500; }
    .drop-sub { color: var(--ink-3); font-size: 13px; margin: 0; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; font-family: var(--font-sans); line-height: 1; }
    .btn:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 2px; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-outline { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
    .btn-outline:hover { border-color: var(--brand-soft); background: var(--brand-tint); color: var(--brand-ink); }
    .btn-primary { background: var(--brand-strong); color: var(--surface); border-color: var(--brand-strong); box-shadow: var(--shadow-1); }
    .btn-primary:hover { background: var(--brand); border-color: var(--brand); }
    .btn-lg { padding: 14px 24px; font-size: 15px; }

    /* Inputs */
    .input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
    .input:focus { border-color: var(--brand-strong); box-shadow: 0 0 0 3px var(--brand-tint); }
    .input::placeholder { color: var(--ink-3); }
    select.input { cursor: pointer; padding-right: 30px; }

    /* Preview grid */
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-4); margin-top: var(--s-5); }
    .preview-grid[hidden] { display: none; }
    @media (max-width: 820px) { .preview-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .preview-grid { grid-template-columns: 1fr; } }
    .preview-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-1); transition: box-shadow .2s, transform .2s, opacity .16s; }
    .preview-card:hover { box-shadow: var(--shadow-2); }
    .preview-thumb-wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--surface-2); overflow: hidden; }
    .preview-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-body { padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); }
    .preview-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .preview-name { font-size: 13px; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65%; }
    .preview-size { font-size: 12px; color: var(--ink-3); flex-shrink: 0; }
    .preview-mood { font-family: var(--font-hand); font-size: 17px; line-height: 1.4; resize: vertical; min-height: 44px; }
    .btn-remove { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; padding: 6px 10px; font-size: 12px; color: var(--state-error); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; transition: border-color .15s, background .15s; font-family: var(--font-sans); }
    .btn-remove:hover { border-color: var(--state-error); }
    .btn-remove:focus-visible { outline: 2px solid var(--state-error); outline-offset: 2px; }

    /* Actions */
    #upload-actions { position: sticky; bottom: var(--s-4); margin-top: var(--s-5); padding: var(--s-3) var(--s-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-2); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; }
    #upload-actions[hidden] { display: none; }
    .count-text { font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
    .count-text strong { color: var(--brand-strong); font-weight: 600; font-size: 15px; }
    .action-buttons { display: flex; align-items: center; gap: var(--s-2); }

    /* Toast */
    #toast { position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--r-md); padding: 12px 18px; display: inline-flex; align-items: center; gap: 10px; box-shadow: var(--shadow-3); font-size: 14px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 100; max-width: 90vw; }
    #toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.toast--success { border-left-color: var(--state-success); }
    #toast.toast--success .toast-icon { color: var(--state-success); }
    #toast.toast--warning { border-left-color: var(--state-warning); }
    #toast.toast--warning .toast-icon { color: var(--state-warning); }
    #toast.toast--error { border-left-color: var(--state-error); }
    #toast.toast--error .toast-icon { color: var(--state-error); }
    #toast.toast--info { border-left-color: var(--state-info); }
    #toast.toast--info .toast-icon { color: var(--state-info); }
    .toast-icon { display: inline-flex; }

    /* Footer */
    .site-footer { max-width: 880px; margin: 0 auto; padding: var(--s-5) var(--s-4) var(--s-6); text-align: center; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line-soft); }

    /* Responsive */
    @media (max-width: 520px) {
      .upload-title { font-size: 26px; }
      #drop-zone { min-height: 240px; padding: var(--s-5) var(--s-3); }
      #upload-actions { flex-direction: column; align-items: stretch; }
      .action-buttons { width: 100%; }
      .action-buttons .btn { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" data-dom-id="back-home" class="topbar-link" aria-label="返回首页">
        <i data-icon data-lucide="arrow-left" class="icon-18"></i>
        <span>返回首页</span>
      </a>
      <div class="topbar-title">上传碎片 · Upload</div>
      <a href="gallery.html" data-dom-id="back-gallery" class="topbar-link" aria-label="前往生活碎片画廊">
        <i data-icon data-lucide="images" class="icon-18"></i>
        <span>生活碎片</span>
      </a>
    </div>
  </header>

  <main id="upload-main">
    <section class="upload-header">
      <h1 class="upload-title">记录一个新的瞬间</h1>
      <p class="upload-subtitle">选一张舍不得删的照片，写下当时的心情。</p>
      <p class="upload-hint">
        <i data-icon data-lucide="info" class="icon-16"></i>
        支持 JPG / PNG / WEBP，单张不超过 10MB
      </p>
    </section>

    <div id="drop-zone" data-dom-id="drop-zone" role="button" tabindex="0" aria-label="拖拽照片到此处或点击选择文件">
      <i data-icon data-lucide="image-up" class="drop-icon icon-48"></i>
      <p class="drop-text">把照片拖到这里</p>
      <button type="button" data-dom-id="select-file" class="btn btn-outline">或点击选择文件</button>
      <p class="drop-sub">可一次选择多张</p>
      <input type="file" id="file-input" multiple accept="image/*" hidden>
    </div>

    <div id="preview-grid" class="preview-grid" hidden aria-live="polite"></div>

    <div id="upload-actions" hidden>
      <span class="count-text" id="count-text">
        <i data-icon data-lucide="image" class="icon-18"></i>
        已选 <strong>0</strong> 张照片
      </span>
      <div class="action-buttons">
        <button type="button" data-dom-id="btn-clear" class="btn btn-outline">
          <i data-icon data-lucide="trash-2" class="icon-16"></i>
          清空
        </button>
        <button type="button" data-dom-id="btn-upload" class="btn btn-primary btn-lg">
          <i data-icon data-lucide="upload-cloud" class="icon-18"></i>
          上传到画廊
        </button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon-wrap"></span>
    <span class="toast-text" id="toast-text"></span>
  </div>

  <footer class="site-footer">
    <p>© 2025 TA的小世界 · 用心记录每一片光</p>
  </footer>

  <script>
    (function () {
      var dropZone = document.getElementById('drop-zone');
      var fileInput = document.getElementById('file-input');
      var selectBtn = document.querySelector('[data-dom-id="select-file"]');
      var previewGrid = document.getElementById('preview-grid');
      var uploadActions = document.getElementById('upload-actions');
      var countText = document.getElementById('count-text');
      var btnClear = document.querySelector('[data-dom-id="btn-clear"]');
      var btnUpload = document.querySelector('[data-dom-id="btn-upload"]');
      var toast = document.getElementById('toast');
      var toastText = document.getElementById('toast-text');
      var toastIconWrap = document.getElementById('toast-icon-wrap');

      var MAX_SIZE = 10 * 1024 * 1024;
      var CATEGORIES = ['日常', '造型', '猫咪', '校园', '心情', '好物'];
      var UPLOAD_SECRET = 'memory-world-2026';
      var UPLOAD_API = '/api/upload';
      var ICONS = { success: 'check-circle-2', warning: 'alert-triangle', error: 'x-circle', info: 'info' };
      var counter = 0;
      var toastTimer = null;

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(2) + ' MB';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function showToast(message, type) {
        type = type || 'info';
        toastText.textContent = message;
        toast.className = 'toast toast-show toast--' + type;
        toastIconWrap.innerHTML = '<i data-icon data-lucide="' + (ICONS[type] || 'info') + '" class="toast-icon icon-20"></i>';
        if (window.lucide) lucide.createIcons();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.className = 'toast toast--' + type;
        }, 2800);
      }

      function updateCount() {
        var n = previewGrid.querySelectorAll('.preview-card').length;
        countText.innerHTML = '<i data-icon data-lucide="image" class="icon-18"></i>已选 <strong>' + n + '</strong> 张照片';
        var has = n > 0;
        previewGrid.hidden = !has;
        uploadActions.hidden = !has;
        if (window.lucide) lucide.createIcons();
      }

      function renderCard(id, file, dataUrl) {
        var card = document.createElement('article');
        card.className = 'preview-card';
        card.setAttribute('data-id', id);
        card._file = file;
        var options = CATEGORIES.map(function (c) {
          return '<option value="' + c + '">' + c + '</option>';
        }).join('');
        card.innerHTML =
          '<div class="preview-thumb-wrap">' +
            '<img class="preview-thumb" src="' + dataUrl + '" alt="' + escapeHtml(file.name) + ' 的预览">' +
          '</div>' +
          '<div class="preview-body">' +
            '<div class="preview-meta">' +
              '<span class="preview-name" title="' + escapeHtml(file.name) + '">' + escapeHtml(file.name) + '</span>' +
              '<span class="preview-size">' + formatSize(file.size) + '</span>' +
            '</div>' +
            '<input type="text" class="input preview-title-input" placeholder="给这张照片起个名字" maxlength="40" aria-label="照片标题">' +
            '<select class="input preview-category" aria-label="照片分类">' +
              '<option value="">选择分类</option>' + options +
            '</select>' +
            '<textarea class="input preview-mood" placeholder="写下当时的心情…" rows="2" maxlength="120" aria-label="当时的心情"></textarea>' +
            '<button type="button" class="btn-remove" data-dom-id="remove-' + id + '" aria-label="删除这张照片">' +
              '<i data-icon data-lucide="trash-2" class="icon-16"></i>' +
              '<span>删除</span>' +
            '</button>' +
          '</div>';
        previewGrid.appendChild(card);
        if (window.lucide) lucide.createIcons();
        updateCount();
      }

      function handleFiles(files) {
        var list = Array.prototype.filter.call(files, function (f) {
          return f.type.indexOf('image/') === 0;
        });
        if (list.length === 0) {
          showToast('请选择图片文件（JPG / PNG / WEBP）', 'warning');
          return;
        }
        var skipped = 0;
        list.forEach(function (file) {
          if (file.size > MAX_SIZE) {
            skipped++;
            return;
          }
          counter++;
          var id = counter;
          var reader = new FileReader();
          reader.onload = function (e) { renderCard(id, file, e.target.result); };
          reader.onerror = function () { showToast('读取 ' + file.name + ' 失败', 'error'); };
          reader.readAsDataURL(file);
        });
        if (skipped > 0) {
          showToast(skipped + ' 张照片超过 10MB，已跳过', 'warning');
        }
      }

      // Open file dialog
      selectBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        fileInput.click();
      });
      dropZone.addEventListener('click', function () {
        fileInput.click();
      });
      dropZone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });

      // Drag feedback
      ['dragenter', 'dragover'].forEach(function (evt) {
        dropZone.addEventListener(evt, function (e) {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('is-dragover');
        });
      });
      ['dragleave', 'dragend', 'dragexit'].forEach(function (evt) {
        dropZone.addEventListener(evt, function (e) {
          e.preventDefault();
          dropZone.classList.remove('is-dragover');
        });
      });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('is-dragover');
        if (e.dataTransfer && e.dataTransfer.files) {
          handleFiles(e.dataTransfer.files);
        }
      });

      // Prevent browser from opening dragged files
      ['dragover', 'drop'].forEach(function (evt) {
        window.addEventListener(evt, function (e) { e.preventDefault(); });
      });

      fileInput.addEventListener('change', function (e) {
        handleFiles(e.target.files);
        fileInput.value = '';
      });

      // Delete preview
      previewGrid.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-dom-id^="remove-"]');
        if (!btn) return;
        var card = btn.closest('.preview-card');
        if (card) {
          card.style.opacity = '0';
          card.style.transform = 'scale(0.96)';
          setTimeout(function () { card.remove(); updateCount(); }, 160);
        }
      });

      // Clear all
      btnClear.addEventListener('click', function () {
        if (!previewGrid.querySelector('.preview-card')) return;
        previewGrid.innerHTML = '';
        updateCount();
        showToast('已清空所有照片', 'info');
      });

      // Upload
      btnUpload.addEventListener('click', function () {
        var cards = previewGrid.querySelectorAll('.preview-card');
        if (cards.length === 0) {
          showToast('请先选择照片', 'warning');
          return;
        }
        btnUpload.disabled = true;
        btnClear.disabled = true;
        showToast('正在上传…', 'info');

        var total = cards.length;
        var done = 0;
        var failed = 0;

        function uploadOne(card) {
          var file = card._file;
          var title = card.querySelector('.preview-title-input') ? card.querySelector('.preview-title-input').value : '';
          var category = card.querySelector('.preview-category') ? card.querySelector('.preview-category').value : '日常';
          var mood = card.querySelector('.preview-mood') ? card.querySelector('.preview-mood').value : '';

          var fd = new FormData();
          fd.append('file', file, file.name);
          fd.append('title', title);
          fd.append('category', category);
          fd.append('mood', mood);

          return fetch(UPLOAD_API, {
            method: 'POST',
            headers: { 'X-Upload-Secret': UPLOAD_SECRET },
            body: fd
          }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }).then(function (data) {
            if (!data.success) throw new Error(data.error || '上传失败');
            done++;
            card.style.opacity = '0.4';
          }).catch(function (err) {
            failed++;
            console.error('上传失败:', err);
          });
        }

        // 串行上传，避免并发限制
        var chain = Promise.resolve();
        cards.forEach(function (card) {
          chain = chain.then(function () { return uploadOne(card); });
        });
        chain.then(function () {
          if (failed === 0) {
            showToast('上传成功！' + done + ' 张碎片已加入画廊', 'success');
          } else if (done > 0) {
            showToast(done + ' 张成功，' + failed + ' 张失败', 'warning');
          } else {
            showToast('上传失败，请稍后重试', 'error');
            btnUpload.disabled = false;
            btnClear.disabled = false;
            return;
          }
          setTimeout(function () {
            window.location.href = 'gallery.html';
          }, 1500);
        });
      });

      // Init
      if (window.lucide) lucide.createIcons();
      updateCount();
    })();
  </script>
</body>
</html>
